<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Qubix Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #fafbff 0%, #f5f7ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    /* ── Panel ── */
    .qi-panel {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e8edf2;
      padding: 48px 44px;
      box-shadow: 0 4px 28px rgba(15,23,42,0.06);
    }

    /* ── Logo ── */
    .qi-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 44px;
    }

    .qi-logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, #FA4616, #c7340f);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(250,70,22,0.3);
    }

    .qi-logo-text { display: flex; flex-direction: column; gap: 2px; }

    .qi-logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .qi-logo-sub {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }

    /* ── Heading ── */
    .qi-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .qi-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 32px;
      line-height: 1.55;
    }

    /* ── Azure injects form into #api ── */
    #api { width: 100%; }

    /* ── Labels ── */
    #api label,
    #api .attrEntry label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      letter-spacing: 0.01em;
      margin-bottom: 5px;
    }

    /* ── Inputs ── */
    #api input[type="email"],
    #api input[type="password"],
    #api input[type="text"] {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1.5px solid #b8c4d0;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.15s, background 0.15s;
      box-sizing: border-box;
      margin-bottom: 18px;
    }

    #api input[type="email"]:focus,
    #api input[type="password"]:focus,
    #api input[type="text"]:focus {
      border-color: #1e293b;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(30,41,59,0.07);
    }

    /* ── Primary button (Sign in / Continue) ── */
    #api #next,
    #api button[type="submit"],
    #api .sendCode {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 14px rgba(15,23,42,0.22);
      letter-spacing: -0.01em;
      transition: all 0.15s ease;
      margin-top: 6px;
    }

    #api #next:hover,
    #api button[type="submit"]:hover,
    #api .sendCode:hover {
      background: #0f172a;
      box-shadow: 0 6px 20px rgba(15,23,42,0.3);
      transform: translateY(-1px);
    }

    /* ── Secondary / cancel button ── */
    #api #cancel,
    #api .cancel,
    #api button[type="button"]:not(.sendCode) {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 46px;
      background: #fff;
      border: 1.5px solid #334155;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s ease;
      margin-top: 10px;
    }

    #api #cancel:hover,
    #api .cancel:hover {
      background: #f8fafc;
      border-color: #0f172a;
      color: #0f172a;
    }

    /* ── Forgot password / helper links ── */
    #api a,
    #api .textButton {
      font-size: 13px;
      color: #64748b;
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.12s;
    }

    #api a:hover,
    #api .textButton:hover {
      color: #FA4616;
      text-decoration: underline;
    }

    /* ── Error messages ── */
    #api .error,
    #api .pageLevel,
    #api .itemLevel p {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #b91c1c;
      margin: 8px 0 12px;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.4;
    }

    /* ── Field entry wrapper ── */
    #api .attrEntry,
    #api .entry {
      margin-bottom: 4px;
    }

    /* ── Required asterisk ── */
    #api abbr { color: #ef4444; text-decoration: none; }

    /* ── Footer ── */
    .qi-footer {
      margin-top: 32px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="qi-panel">

    <!-- Logo -->
    <div class="qi-logo">
      <div class="qi-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <polygon points="12,2 22,7 12,12 2,7" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
          <polyline points="2,12 12,17 22,12" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linejoin="round"/>
          <polyline points="2,17 12,22 22,17" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="qi-logo-text">
        <span class="qi-logo-name">Qubix Insight</span>
        <span class="qi-logo-sub">iLogix Global</span>
      </div>
    </div>

    <!-- Heading -->
    <h2 class="qi-title">Sign in</h2>
    <p class="qi-subtitle">Access your Qubix Insight trial account</p>

    <!-- Azure External ID injects the form here -->
    <div id="api"></div>

    <p class="qi-footer">© 2026 Qubix Insight · All rights reserved</p>
  </div>
</body>
</html>
