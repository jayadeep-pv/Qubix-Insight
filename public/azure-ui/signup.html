<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Start Free Trial · Qubix Insight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(160deg, #fafbff 0%, #f5f7ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
    }

    /* ── Panel ── */
    .qi-panel {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 18px;
      border: 1px solid #e8edf2;
      padding: 48px 44px;
      box-shadow: 0 4px 28px rgba(15,23,42,0.06);
    }

    /* ── Logo ── */
    .qi-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .qi-logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, #FA4616, #c7340f);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(250,70,22,0.3);
    }

    .qi-logo-text { display: flex; flex-direction: column; gap: 2px; }

    .qi-logo-name {
      font-family: 'Syne', sans-serif;
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .qi-logo-sub {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
    }

    /* ── Heading ── */
    .qi-title {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
    }

    .qi-subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    /* ── Azure injects form into #api ── */
    #api { width: 100%; }

    /* ── Two-column layout for name fields ── */
    #api .attrEntry[data-claim="givenName"],
    #api .attrEntry[data-claim="surname"] {
      display: inline-block;
      width: calc(50% - 6px);
      vertical-align: top;
    }

    #api .attrEntry[data-claim="givenName"] { margin-right: 12px; }

    /* ── Labels ── */
    #api label,
    #api .attrEntry label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      letter-spacing: 0.01em;
      margin-bottom: 5px;
    }

    /* ── All inputs ── */
    #api input[type="email"],
    #api input[type="password"],
    #api input[type="text"],
    #api input[type="tel"] {
      width: 100%;
      height: 42px;
      padding: 0 13px;
      border: 1.5px solid #b8c4d0;
      border-radius: 10px;
      font-size: 13.5px;
      color: #0f172a;
      background: #f8fafc;
      outline: none;
      font-family: 'DM Sans', sans-serif;
      transition: border-color 0.15s, background 0.15s;
      box-sizing: border-box;
    }

    #api input:focus {
      border-color: #1e293b;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(30,41,59,0.07);
    }

    /* ── Verification code input ── */
    #api #emailVerificationControl_but_send_code,
    #api #emailVerificationControl_but_verify_code {
      height: 42px;
      padding: 0 18px;
      background: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
      margin-left: 8px;
      flex-shrink: 0;
    }

    #api #emailVerificationControl_but_send_code:hover,
    #api #emailVerificationControl_but_verify_code:hover {
      background: #0f172a;
      transform: translateY(-1px);
    }

    /* ── Email verification row (input + button side by side) ── */
    #api .verificationControlContent {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    #api .verificationControlContent input {
      flex: 1;
    }

    /* ── Field entry wrapper ── */
    #api .attrEntry {
      margin-bottom: 14px;
    }

    /* ── Required asterisk ── */
    #api abbr { color: #ef4444; text-decoration: none; }

    /* ── Primary button (Continue / Create account) ── */
    #api #continue,
    #api button[type="submit"] {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: #1e293b;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      box-shadow: 0 4px 14px rgba(15,23,42,0.22);
      letter-spacing: -0.01em;
      transition: all 0.15s ease;
      margin-top: 10px;
    }

    #api #continue:hover,
    #api button[type="submit"]:hover {
      background: #0f172a;
      box-shadow: 0 6px 20px rgba(15,23,42,0.3);
      transform: translateY(-1px);
    }

    /* ── Cancel / back link ── */
    #api #cancel {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 14px;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.12s;
    }

    #api #cancel:hover { color: #0f172a; }

    /* ── Error messages ── */
    #api .error,
    #api .pageLevel,
    #api .itemLevel p {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #b91c1c;
      margin: 6px 0 10px;
      font-family: 'DM Sans', sans-serif;
      line-height: 1.4;
    }

    /* ── Success / info messages ── */
    #api .alert-success,
    #api .verificationSuccessText {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #166534;
      margin: 6px 0 10px;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Divider ── */
    .qi-divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 20px 0;
      color: #64748b;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .qi-divider::before,
    .qi-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #e8edf2;
    }

    /* ── Footer ── */
    .qi-footer {
      margin-top: 28px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="qi-panel">

    <!-- Logo -->
    <div class="qi-logo">
      <div class="qi-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <polygon points="12,2 22,7 12,12 2,7" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
          <polyline points="2,12 12,17 22,12" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linejoin="round"/>
          <polyline points="2,17 12,22 22,17" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="qi-logo-text">
        <span class="qi-logo-name">Qubix Insight</span>
        <span class="qi-logo-sub">iLogix Global</span>
      </div>
    </div>

    <!-- Heading -->
    <h2 class="qi-title">Start your free trial</h2>
    <p class="qi-subtitle">30 days free · No credit card required</p>

    <!-- Azure External ID injects the form here -->
    <div id="api"></div>

    <p class="qi-footer">© 2026 Qubix Insight · All rights reserved</p>
  </div>
</body>
</html>
